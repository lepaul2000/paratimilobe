<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti mailob ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card" id="card">
            <!-- Sección inicial con pregunta -->
            <div class="question-section" id="questionSection">
                <h1 class="title">Este tiempo contigo me ha hecho amarte cada vez más</h1>
                <p class="subtitle">es por eso que quiero decirte que...</p>
                
                <div class="question">
                    <h2>Te amo mucho, de aqui a la galaxia mas lejana a paso de caracol</h2>
                </div>
                
                <div class="image-container">
                    <img src="gato.gif" alt="Gato animado" class="main-image">
                </div>
                
                <div class="button-container">
                    <button class="btn btn-yes" onclick="answer('yes')">
                        <span>💙 Nuestros recuerdos</span>
                    </button>
                    <button class="btn btn-no" onclick="answer('no')">
                        <span>💜 Lo que siento por ti</span>
                    </button>
                </div>
            </div>

            <!-- Sección de respuesta -->
            <div class="response-section" id="responseSection" style="display: none;">
                <div class="response-content" id="responseContent">
                    <!-- Se llenará con JavaScript -->
                </div>
            </div>

            <!-- Sección de álbum de fotos -->
            <div class="album-section" id="albumSection" style="display: none;">
                <h2 class="album-title">📸 Nuestro Álbum de Recuerdos</h2>
                
                <div class="upload-area">
                    <input type="file" id="photoInput" accept="image/*" multiple style="display: none;">
                    <button class="btn btn-upload" onclick="document.getElementById('photoInput').click()">
                        <span>➕ Agregar Foto</span>
                    </button>
                    <p class="upload-hint" id="uploadHint">Haz clic para seleccionar fotos (máximo 200 fotos)</p>
                </div>

                <div class="gallery" id="gallery">
                    <!-- Las fotos se cargarán aquí -->
                </div>

                <div class="album-actions">
                    <button class="btn btn-yes" onclick="goBackToResponse()">
                        <span>⬅️ Atrás</span>
                    </button>
                    <button class="btn btn-no" id="musicToggleBtn" onclick="toggleMusic()">
                        <span>🔇 Música OFF</span>
                    </button>
                </div>
            </div>

            <!-- Modal del carrusel -->
            <div class="carousel-modal" id="carouselModal" style="display: none;">
                <div class="carousel-overlay" onclick="closeCarousel()"></div>
                <div class="carousel-content">
                    <button class="carousel-close" onclick="closeCarousel()">✕</button>
                    <button class="carousel-nav carousel-prev" onclick="prevPhoto()">‹</button>
                    <img id="carouselImage" src="" alt="Foto en carrusel">
                    <button class="carousel-nav carousel-next" onclick="nextPhoto()">›</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, listAll, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
    </script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
